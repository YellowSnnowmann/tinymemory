[package]
name = "tinymemory-testing-ui"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local HTTP + web UI harness for exercising TinyMemory engines by hand"

[[bin]]
name = "tinymemory-testing-ui"
path = "src/main.rs"

[dependencies]
# The engine-neutral contract this harness drives every engine through.
tinymemory = { path = "../tinymemory" }
tinymemory-api = { path = "../tinymemory-api" }
# The TinyCortex adapter backs the "local" engine choice (in-process, no
# network, no API key). Re-exports the `tinycortex` engine crate itself
# (`tinymemory_tinycortex::tinycortex`) and its `InMemoryMemoryStore`, so this
# crate does not need its own direct dependency (and patch table entry) on it.
tinymemory-tinycortex = { path = "../tinymemory-tinycortex" }
# The Supermemory / Mem0 / Cognee adapters back the "remote" engine choices.
tinymemory-remote = { path = "../tinymemory-remote" }
# Document and URL intake, behind `/api/documents/upload` and
# `/api/ingest/url`. `network` is on because fetching a URL by hand is half the
# point of a harness.
tinymemory-documents = { path = "../tinymemory-documents", features = ["network"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `multipart` for the document upload endpoint: a file upload is the one thing
# a JSON body cannot carry without base64-ing it first.
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
