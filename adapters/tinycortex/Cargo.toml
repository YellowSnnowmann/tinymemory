[package]
name = "tinymemory-tinycortex"
# Not published: `tinymemory-core` depends on `tinycortex-api`, which is
# consumed by path and is not on crates.io, so `cargo package` cannot resolve
# the graph. Every consumer takes this repo by path or git.
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "TinyCortex engine adapter for the TinyMemory contract"
repository = "https://github.com/tinyhumansai/tinymemory"

[dependencies]
# The contract this adapter targets.
tinymemory = { path = "../.." }
tinymemory-api = { path = "../../api" }
# The engine being adapted. A version requirement rather than a path, so a host
# that already pins its own TinyCortex checkout unifies both onto one copy
# through its `[patch.crates-io]`; the workspace root patches it to the nested
# `vendor/tinycortex` submodule for a standalone build. A path dependency here
# would defeat that and give a host two TinyCortex crates with two incompatible
# `Memory` traits.
tinycortex = { version = "0.1", default-features = false }

# `Memory` is an object-safe async trait.
async-trait = "0.1"
# The engine's trait surface is anyhow-typed.
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# `expect`/`panic` are denied in the library the same way the facade denies them.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
